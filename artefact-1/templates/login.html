{% extends 'base.html' %}

{% block body%}
  <h1>Sign In</h1>

  <form method="post">
    <div>
    {{ form.email.label }}
    {{ form.email }}
    </div>
    <div>
    {{ form.password.label }}
    {{ form.password }}
    </div>
    <div>
    {{ form.remember.label }}
    {{ form.remember }}
    {{ form.submit }}
    </div>
  </form>
  <br>
{% endblock body%}
