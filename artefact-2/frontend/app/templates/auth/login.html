{% extends 'elements/base.html' %}

{% block body%}

<div class="d-flex vh-100 justify-content-center py-4">
  <form class="py-5" method="post">
    <h1 class="display-6 mb-5">Sign in to an existing account</h1>
    {{ form.email.label }}
    <div class="form-floating mb-3">
      {{ form.email }}
    </div>
    {{ form.password.label }}
    <div class="form-floating mb-3">
      {{ form.password }}
    </div>
    <div>
      <button class="w-100 btn btn-lg btn-primary mt-3" type="submit">
        Log in
      </button>
    </div>
  </form>
</div>

{% endblock body%}
